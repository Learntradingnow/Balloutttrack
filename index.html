<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balloutt Trades — Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d0131;
      color: #f0eaff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #c99bff;
    }
    .sub {
      color: #a89cc4;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(168, 85, 247, 0.06);
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a89cc4;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card h2 .total-badge {
      font-size: 14px;
      color: #f0eaff;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(168, 85, 247, 0.06);
    }
    .row:last-child {
      border-bottom: none;
    }
    .row.sub-item {
      padding-left: 16px;
      font-size: 13px;
    }
    .label {
      color: #d4ccf0;
      font-size: 14px;
    }
    .label.sub {
      color: #a89cc4;
      font-size: 13px;
    }
    .value {
      font-weight: 700;
      font-size: 15px;
    }
    .value.green { color: #3ce88a; }
    .value.red { color: #ff3b4e; }
    .value.violet { color: #c99bff; }
    .total {
      font-size: 32px;
      font-weight: 800;
      color: #f0eaff;
      margin: 4px 0 2px;
    }
    .inline-edit {
      background: transparent;
      border: none;
      color: #f0eaff;
      font-weight: 700;
      font-size: 15px;
      width: 80px;
      text-align: right;
      font-family: inherit;
    }
    .inline-edit:focus {
      outline: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 6px;
    }
    .inline-edit.green { color: #3ce88a; }
    .inline-edit.red { color: #ff3b4e; }
    .inline-edit.violet { color: #c99bff; }
    .inline-edit.gold { color: #ffc93c; }
    .inline-edit.small { width: 60px; font-size: 13px; }
    .add-btn {
      background: rgba(168, 85, 247, 0.1);
      border: 1px dashed rgba(168, 85, 247, 0.3);
      color: #a89cc4;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
    }
    .add-btn:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.5);
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #5e5478;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }
    .remove-btn:hover {
      color: #ff3b4e;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(168, 85, 247, 0.15);
      border-radius: 10px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #c99bff);
      border-radius: 10px;
      width: 0%;
    }
    .habit-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(168, 85, 247, 0.06);
    }
    .habit-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #a855f7;
      cursor: pointer;
    }
    .habit-label {
      font-size: 14px;
      color: #d4ccf0;
    }
    .habit-label.done {
      text-decoration: line-through;
      color: #6f5f93;
    }
    .goal-title {
      font-weight: 600;
      font-size: 15px;
      color: #f0eaff;
    }
    .goal-sub {
      font-size: 12px;
      color: #a89cc4;
      margin-bottom: 2px;
    }
    .footer {
      text-align: center;
      color: #5e5478;
      font-size: 12px;
      margin-top: 20px;
    }
    @media (max-width: 420px) {
      body { padding: 12px; }
      .total { font-size: 28px; }
      .row { flex-wrap: wrap; gap: 4px; }
    }
  </style>
</head>
<body>
<div class="container">

  <h1>⚡ Balloutt Trades</h1>
  <div class="sub">Personal Dashboard · <span id="dateDisplay"></span></div>

  <!-- Net Worth -->
  <div class="card">
    <h2>Net Worth</h2>
    <div class="total" id="netWorth">$0</div>
    <div style="display:flex;gap:12px;margin-top:4px;font-size:13px;color:#a89cc4;">
      <span>📈 Income: <strong id="totalIncome">$0</strong></span>
      <span>📉 Expenses: <strong id="totalExpenses">$0</strong></span>
    </div>
  </div>

  <!-- Income -->
  <div class="card">
    <h2>📊 Income <span class="total-badge" id="incomeTotal">$0</span></h2>
    <div id="incomeList"></div>
    <button class="add-btn" onclick="addIncomeItem()">+ Add Income</button>
  </div>

  <!-- Expenses -->
  <div class="card">
    <h2>💸 Expenses <span class="total-badge" id="expenseTotal">$0</span></h2>
    <div id="expenseList"></div>
    <button class="add-btn" onclick="addExpenseItem()">+ Add Expense</button>
  </div>

  <!-- Goals -->
  <div class="card">
    <h2>🎯 Goals</h2>
    <div id="goalList"></div>
    <button class="add-btn" onclick="addGoal()">+ Add Goal</button>
  </div>

  <!-- Habits -->
  <div class="card">
    <h2>✅ Daily Habits</h2>
    <div id="habitList"></div>
    <button class="add-btn" onclick="addHabit()">+ Add Habit</button>
  </div>

  <div class="footer">© 2026 Balloutt Trades LLC · data stays on your device</div>
</div>

<script>
  // ===== DATA =====
  let data = {
    income: [
      { id: 'i1', label: 'Trading P&L', amount: 0 },
      { id: 'i2', label: 'Mentorship', amount: 0 },
      { id: 'i3', label: 'Alerts ($450/mo)', amount: 0 },
      { id: 'i4', label: 'Affiliates', amount: 0 }
    ],
    expenses: [
      { id: 'e1', label: 'Business Costs', amount: 0 },
      { id: 'e2', label: 'Subscriptions', amount: 0 },
      { id: 'e3', label: 'Other', amount: 0 }
    ],
    goals: [
      { id: 'g1', label: '$10K Funded Account', sub: 'Strix', progress: 65 },
      { id: 'g2', label: '100 Members', sub: 'Community', progress: 40 }
    ],
    habits: [
      { id: 'h1', label: 'Check pre-market levels', done: false },
      { id: 'h2', label: 'Post watchlist', done: false },
      { id: 'h3', label: 'Trade review / journal', done: false },
      { id: 'h4', label: 'Check Strix / affiliate stats', done: false }
    ]
  };

  let idCounter = 100;

  // ===== LOAD / SAVE =====
  function loadData() {
    try {
      const saved = localStorage.getItem('balloutt_dashboard');
      if (saved) {
        const parsed = JSON.parse(saved);
        // Merge with defaults to handle new fields
        data.income = parsed.income || data.income;
        data.expenses = parsed.expenses || data.expenses;
        data.goals = parsed.goals || data.goals;
        data.habits = parsed.habits || data.habits;
      }
    } catch (e) {}
  }

  function saveData() {
    localStorage.setItem('balloutt_dashboard', JSON.stringify(data));
  }

  // ===== RENDER =====
  function render() {
    renderIncome();
    renderExpenses();
    renderGoals();
    renderHabits();
    updateTotals();
  }

  function renderIncome() {
    const container = document.getElementById('incomeList');
    container.innerHTML = '';
    data.income.forEach(item => {
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `
        <span class="label">${item.label}</span>
        <input class="inline-edit green" type="number" value="${item.amount}" 
               data-id="${item.id}" data-type="income" step="50"
               onchange="updateAmount(this, 'income')">
      `;
      container.appendChild(div);
    });
  }

  function renderExpenses() {
    const container = document.getElementById('expenseList');
    container.innerHTML = '';
    data.expenses.forEach(item => {
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `
        <span class="label">${item.label}</span>
        <input class="inline-edit red" type="number" value="${item.amount}" 
               data-id="${item.id}" data-type="expense" step="20"
               onchange="updateAmount(this, 'expense')">
      `;
      container.appendChild(div);
    });
  }

  function renderGoals() {
    const container = document.getElementById('goalList');
    container.innerHTML = '';
    data.goals.forEach(item => {
      const div = document.createElement('div');
      div.style.marginBottom = '12px';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="goal-title">${item.label}</div>
            <div class="goal-sub">${item.sub}</div>
          </div>
          <input class="inline-edit gold small" type="number" value="${item.progress}" 
                 data-id="${item.id}" data-type="goal" step="5" style="width:50px;"
                 onchange="updateGoalProgress(this)">
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${item.progress}%;"></div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function renderHabits() {
    const container = document.getElementById('habitList');
    container.innerHTML = '';
    data.habits.forEach(item => {
      const div = document.createElement('div');
      div.className = 'habit-row';
      div.innerHTML = `
        <input type="checkbox" ${item.done ? 'checked' : ''} 
               data-id="${item.id}" onchange="toggleHabit(this)">
        <label class="habit-label ${item.done ? 'done' : ''}">${item.label}</label>
      `;
      container.appendChild(div);
    });
  }

  // ===== UPDATE FUNCTIONS =====
  function updateAmount(input, type) {
    const id = input.dataset.id;
    const value = parseFloat(input.value) || 0;
    const list = type === 'income' ? data.income : data.expenses;
    const item = list.find(i => i.id === id);
    if (item) {
      item.amount = value;
      saveData();
      updateTotals();
      renderIncome();
      renderExpenses();
    }
  }

  function updateGoalProgress(input) {
    const id = input.dataset.id;
    const value = parseFloat(input.value) || 0;
    const item = data.goals.find(g => g.id === id);
    if (item) {
      item.progress = Math.min(100, Math.max(0, value));
      saveData();
      renderGoals();
    }
  }

  function toggleHabit(checkbox) {
    const id = checkbox.dataset.id;
    const item = data.habits.find(h => h.id === id);
    if (item) {
      item.done = checkbox.checked;
      saveData();
      renderHabits();
    }
  }

  function updateTotals() {
    const incomeTotal = data.income.reduce((sum, i) => sum + i.amount, 0);
    const expenseTotal = data.expenses.reduce((sum, e) => sum + e.amount, 0);
    const netWorth = incomeTotal - expenseTotal;

    document.getElementById('totalIncome').textContent = '$' + incomeTotal.toLocaleString();
    document.getElementById('totalExpenses').textContent = '$' + expenseTotal.toLocaleString();
    document.getElementById('netWorth').textContent = '$' + netWorth.toLocaleString();
    document.getElementById('incomeTotal').textContent = '$' + incomeTotal.toLocaleString();
    document.getElementById('expenseTotal').textContent = '$' + expenseTotal.toLocaleString();
  }

  // ===== ADD ITEMS =====
  function addIncomeItem() {
    const label = prompt('Income source name:');
    if (label && label.trim()) {
      data.income.push({ id: 'i' + (++idCounter), label: label.trim(), amount: 0 });
      saveData();
      render();
    }
  }

  function addExpenseItem() {
    const label = prompt('Expense name:');
    if (label && label.trim()) {
      data.expenses.push({ id: 'e' + (++idCounter), label: label.trim(), amount: 0 });
      saveData();
      render();
    }
  }

  function addGoal() {
    const label = prompt('Goal name:');
    if (!label || !label.trim()) return;
    const sub = prompt('Subtitle (e.g., Strix, Community):') || '';
    data.goals.push({ id: 'g' + (++idCounter), label: label.trim(), sub: sub, progress: 0 });
    saveData();
    render();
  }

  function addHabit() {
    const label = prompt('Habit name:');
    if (label && label.trim()) {
      data.habits.push({ id: 'h' + (++idCounter), label: label.trim(), done: false });
      saveData();
      render();
    }
  }

  // ===== INIT =====
  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  loadData();
  render();

  // Auto-save on page unload
  window.addEventListener('beforeunload', saveData);
</script>
</body>
</html>
